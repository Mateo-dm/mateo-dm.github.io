<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALS Online</title>
    <style>
        body {
            font-family: 'B Roya', Tahoma, Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #1a2a6c;
            font-size: 28px;
            margin: 0 0 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.8;
            margin: 10px 0;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">✅ تأیید شده</div>
        <h1>🏥 MALS Online</h1>
        <p>سامانه یادگیری تطبیقی پزشکی</p>
        <p style="font-size: 14px; color: #888;">این صفحه برای تأیید مالکیت وبسایت ساخته شده است.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 12px; color: #aaa;">آخرین بروزرسانی: ۱۴۰۴/۰۶/۰۷</p>
    </div>
</body>
</html>
